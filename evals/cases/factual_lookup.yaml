# factual_lookup — 8 cases
#
# Straight retrieval: titles, dates, stack, what a project does. The model is
# expected to be good at these; they exist to catch a prompt edit that drops or
# garbles a fact, not to be hard.
#
# Schema: evals/README.md#case-schema

- id: fl-001
  category: factual_lookup
  surface: chat
  question: "What was Adam's role at Sigo Signs, and what were the dates?"
  graders:
    forbidden: default
    grounded_entities: strict
    max_chars: 1200
    must_include_any:
      - ["software trainer", "trainer"]
      - ["internal tools developer", "internal-tools developer", "sole developer"]
    must_match_daterange: "Oct 2025 - Dec 2025"
  judge:
    dimensions: [groundedness, directness]
    min: { groundedness: 4, directness: 3 }
  expect: pass
  facts_ref: [title.sigo, dates.sigo]

- id: fl-002
  category: factual_lookup
  surface: chat
  question: "What's BodyCraft built with?"
  graders:
    forbidden: default
    grounded_entities: strict
    max_chars: 1200
