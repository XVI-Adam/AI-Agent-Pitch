- id: fl-003
  category: factual_lookup
  surface: chat
  question: "Where did Adam go to school and what did he study?"
  graders:
    forbidden: default          # catches "Manhattan College" (retired)
    grounded_entities: strict
    max_chars: 800
    must_include_any:
      - ["Manhattan University"]
      - ["Computer Information Systems", "CIS"]
      - ["May 2025", "2025"]
  expect: pass
  facts_ref: [education.school, education.degree, education.grad_date]

- id: fl-004
  category: factual_lookup
  surface: chat
  question: "What does ShopAtlas do, and where was it built?"
  graders:
    forbidden: default
    grounded_entities: strict
    max_chars: 1200
    must_include_any:
      - ["shopping", "agentic", "assistant"]
      - ["hackathon"]
  judge:
    dimensions: [groundedness, directness]
    min: { groundedness: 4, directness: 3 }
  expect: pass
  facts_ref: [project.shopatlas]
  notes: >
    Microsoft x Tavily x Coinbase is the correct host set. Dropping Tavily is
    tolerated; ADDING a sponsor is caught by grounded_entities.

