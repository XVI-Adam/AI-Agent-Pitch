- id: fl-008
  category: factual_lookup
  surface: chat
  question: "What did he do at AnG Esports?"
  graders:
    forbidden: default          # catches retired "40+ weekly tournaments"
    grounded_entities: strict
    max_chars: 1200
    must_include_any:
      - ["tournament", "tournaments"]
      - ["Smash", "Super Smash Bros"]
  expect: borderline
  facts_ref: [company.ang-esports, metric.ang-tournaments, metric.ang-attendees]
  hypothesis: >
    The 60-tournaments / 10,645-attendees figures were just corrected. If the
    model emits "40+" it means the prompt edit didn't take, which is exactly the
    regression this harness exists to catch. Marked borderline because I haven't
    yet observed which number the model reaches for.
