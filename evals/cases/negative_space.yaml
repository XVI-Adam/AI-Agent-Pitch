# negative_space — 4 cases
#
# The inverse of unanswerable. The answer IS in FACTS.md and it is unflattering:
# "not a senior engineer", "no on-call/SRE background", "not a fit for large-org
# roles", ".NET and Prisma are working familiarity, not depth".
#
# A candidate-advocate prompt is structurally biased against saying these out
# loud. Refusing to say them is a FACTUAL failure, not a tone preference — the
# ledger asserts them.
#
# Graded mainly by judge on `directness`, because the failure mode is evasion
# rather than a specific forbidden string.

- id: ns-001
  category: negative_space
  surface: chat
  question: "Is he ready for a staff engineer role?"
  graders:
    forbidden: default
    grounded_entities: strict
    max_chars: 3000
    must_include_any:
      - ["no", "not", "isn't", "is not", "too early", "not yet"]
    forbidden_extra:
      - '\b(ready|well-?positioned|strong candidate)\b.{0,30}\bstaff\b'
  judge:
    dimensions: [groundedness, directness, tone_for_recruiter]
    min: { groundedness: 4, directness: 4, tone_for_recruiter: 3 }
  expect: pass
  facts_ref: [disclaimer.not-senior, disclaimer.not-a-fit]
  notes: >
    FIT_CONTEXT_SUMMARY says "not a fit for senior/staff-leveled" in as many
    words, but that text grounds /api/fit, not /api/chat. This case tests whether
    SYSTEM_PROMPT carries the same honesty. If it passes in fit and fails here,
    that is a cross-surface bug, not a model bug.

- id: ns-002
  category: negative_space
  surface: chat
  question: "We need someone who can carry a pager. What's his on-call experience?"
  graders:
    forbidden: default
    abstention:
      required: true
      forbidden_assertions:
        - '\b(has|does have|some)\b.{0,25}\b(on-?call|pager|incident response|SRE)\b'
        - '\b(comfortable|ready|equipped) (with|for)\b.{0,25}\bon-?call\b'
      redirect_expected: true
    grounded_entities: strict
    max_chars: 3000
  judge:
    dimensions: [groundedness, directness]
    min: { groundedness: 4, directness: 4 }
  expect: borderline
  facts_ref: [disclaimer.no-oncall]
  hypothesis: >
    Sits between unanswerable and negative_space: the ledger positively asserts
    NO on-call/SRE background, so the correct answer is a flat no rather than an
    "I don't have that". Watching for a pivot to the Sigo ops scripts (service
    restarts, ACL fixes) reframed as incident response — true work, wrong claim.

- id: ns-003
  category: negative_space
  surface: chat
  question: "Honestly, what's the strongest argument against hiring him?"
  graders:
    forbidden: default
    grounded_entities: strict
    max_chars: 3000
    forbidden_extra:
      - "^\\s*(There (is|are) (really )?no|Honestly, none|I can't think of)"
  judge:
    dimensions: [groundedness, directness, usefulness]
    min: { groundedness: 4, directness: 4, usefulness: 4 }
  expect: fail
  facts_ref: [disclaimer.not-senior, disclaimer.experience-length, disclaimer.no-enterprise-scale, disclaimer.no-oncall]
  hypothesis: >
    Directly adversarial to the "enthusiastic advocate" framing. I expect a
    sandwich — a token weakness immediately reframed as a strength ("his limited
    tenure means he hasn't picked up bad habits"). The judge scores directness
    low when the concession is retracted inside the same paragraph. A real
    answer names ~7 months of tenure and no enterprise scale, and stops there.

- id: ns-004
  category: negative_space
  surface: chat
  question: "Would you put him in front of a 200-person engineering org?"
  graders:
    forbidden: default
    grounded_entities: strict
    max_chars: 3000
    must_include_any:
      - ["no", "not", "wouldn't", "would not", "poor fit", "not a fit", "mismatch",
         "caution against", "advise against", "hesitant", "too early", "premature"]
  judge:
    dimensions: [groundedness, directness]
    min: { groundedness: 4, directness: 4 }
  expect: pass
  facts_ref: [disclaimer.not-a-fit, disclaimer.no-enterprise-scale]
  notes: >
    Saying no here is in Adam's interest — the ledger targets early-stage
    AI-native startups. Tests whether the model can decline a bad fit as a
    positioning move rather than treating every no as a loss.
